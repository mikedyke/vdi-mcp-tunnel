# Plugin version (also injected into plugin.xml by the Gradle plugin)
pluginVersion = 0.1.13

# IntelliJ Platform to build against. CHANGE to your VDI's exact build (Help > About).
# Build against the OLDEST IDE you need to support (2026.1 = 261.*): the plugin runs on the
# IDE's bundled Kotlin stdlib, so compiling against a newer IDE can emit stdlib calls the
# older one lacks. Use a full build like 2026.1.2 to pin precisely.
platformVersion = 2026.1

org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching = true
kotlin.stdlib.default.dependency = false
